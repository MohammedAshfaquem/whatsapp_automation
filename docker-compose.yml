services:
  db:
    image: postgres:16-alpine
    container_name: ac_shop_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ac_whatsapp_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
