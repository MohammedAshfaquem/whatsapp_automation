<style>.password-toggle-wrap{position:relative;display:block;width:100%}.password-toggle-wrap input{padding-right:3rem!important;width:100%;box-sizing:border-box}.password-toggle-button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:0;padding:6px;color:#64748b;cursor:pointer;display:flex;align-items:center;justify-content:center}.password-toggle-button:focus-visible{outline:2px solid #11b76d;border-radius:4px}</style>
<script>
(function(){
 let sequence=0;
 const icon=(shown)=>'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>'+(shown?'<path d="m3 3 18 18"/>':'')+'</svg>';
 function enhance(){document.querySelectorAll('input[type="password"]:not([data-password-toggle])').forEach(input=>{
  input.dataset.passwordToggle='true';if(!input.id)input.id='password-field-'+(++sequence);
  const label=Array.from(input.labels||[]).map(x=>x.textContent.trim()).join(' ')||input.getAttribute('aria-label')||'password';
  const wrap=document.createElement('span');wrap.className='password-toggle-wrap';input.parentNode.insertBefore(wrap,input);wrap.appendChild(input);
  const button=document.createElement('button');button.type='button';button.className='password-toggle-button';button.setAttribute('aria-controls',input.id);button.disabled=input.disabled;
  function update(){const shown=input.type==='text';button.setAttribute('aria-label',(shown?'Hide ':'Show ')+label);button.setAttribute('aria-pressed',String(shown));button.innerHTML=icon(shown);}
  button.addEventListener('mousedown',e=>e.preventDefault());button.addEventListener('click',()=>{input.type=input.type==='password'?'text':'password';update();});wrap.appendChild(button);update();
 });}
 function start(){enhance();new MutationObserver(enhance).observe(document.body,{childList:true,subtree:true});}
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',start,{once:true});else start();
})();
</script>
